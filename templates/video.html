<html lang="en">
<head>
  <title>Video Detection | Car Damage Detection</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,900" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/bootstrap.css"><link rel="stylesheet" href="../static/css/animate.css"><link rel="stylesheet" href="../static/css/owl.carousel.min.css"><link rel="stylesheet" href="../static/fonts/ionicons/css/ionicons.min.css"><link rel="stylesheet" href="../static/fonts/fontawesome/css/font-awesome.min.css"><link rel="stylesheet" href="../static/fonts/flaticon/font/flaticon.css"><link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <header role="banner"><nav class="navbar navbar-expand-md navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('first') }}">Car Damage Detection</a><button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="siteNavbar"><ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link" href="{{ url_for('first') }}">Home</a></li><li class="nav-item"><a class="nav-link" href="{{ url_for('image') }}">Image</a></li><li class="nav-item"><a class="nav-link active" href="{{ url_for('video') }}">Video</a></li><li class="nav-item"><a class="nav-link" href="{{ url_for('webcam') }}">Webcam</a></li></ul></div></div></nav></header>
  <section class="site-hero site-hero-innerpage overlay" data-stellar-background-ratio="0.5" style="background-image: url(../static/images/wheat6.jpg);"><div class="container"><div class="row align-items-center site-hero-inner justify-content-center"><div class="col-md-8 text-center"><div class="mb-5 element-animate"><h1>Video Damage Detection</h1></div></div></div></div></section>
  <section class="site-section bg-light"><div class="container"><div class="row justify-content-center mb-4"><div class="col-md-8 text-center"><h2>Upload MP4 Video</h2><p class="lead">Process video frames and generate damage-annotated output.</p></div></div><div class="row justify-content-center"><div class="col-lg-7"><form class="card p-4" action="{{ url_for('predict_img')}}" method="post" enctype="multipart/form-data" onsubmit="return validateForm()"><input type="file" name="file" class="form-control-file" id="inputfile" accept="video/mp4"><button class="btn btn-primary mt-4" type="submit">Upload & Process</button></form></div></div></div></section>
  <footer class="site-footer" style="background-image: url(../static/images/big_image_3.jpg);"><div class="container"></div></footer>
  <div id="loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee" /><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#f4b214" /></svg></div>
  <script>function validateForm(){var inputFile=document.getElementById('inputfile');if(inputFile.files.length===0){alert('Please upload a video first.');return false;}var allowedTypes=['video/mp4'];if(allowedTypes.indexOf(inputFile.files[0].type)===-1){alert('Please upload a valid MP4 file.');return false;}return true;}</script>
